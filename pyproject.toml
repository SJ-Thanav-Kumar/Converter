[project]
name = "converter"
version = "0.1.0"
description = "Local image/video file converter (learning project -> desktop app)"
requires-python = ">=3.9"
dependencies = ["Pillow>=10"]   # FFmpeg is an external tool, not a pip package

[project.optional-dependencies]
desktop = ["PySide6>=6.5"]       # Module 19
build = ["pyinstaller>=6"]       # Module 19 packaging

[tool.setuptools.packages.find]
include = ["core*", "desktop*"]
